description: Driver module for EV side for the Raspi-EV(SE) v2.4 hardware
config:
  i2c_dev:
    description: I2C Device Path
    type: string
    default: /dev/i2c-0
  i2c_freq:
    description: I2C Clock Frequency
    type: integer
    minimum: 10000
    maximum: 100000
    default: 10000
  i2c_addr:
    description: 7bit I2C Device Address
    type: integer
    minimum: 1
    maximum: 255
    default: 56
provides:
  main:
    interface: ev_board_support
    description: provides the board support Interface to low level control control pilot, relais, rcd
enable_telemetry: true
metadata:
  license: https://opensource.org/licenses/Apache-2.0
  authors:
    - JuanJuan
